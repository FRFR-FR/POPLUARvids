name: Download and animate Smithsonian CC0 fossil model

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/animate_smithsonian_model.py"
      - ".github/workflows/smithsonian-model-clips.yml"

permissions:
  contents: read

concurrency:
  group: smithsonian-model-animation
  cancel-in-progress: false

jobs:
  render-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
      - name: Download Smithsonian model and render animation
        run: blender -b --python scripts/animate_smithsonian_model.py
      - name: Upload model, animation and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smithsonian-megalodon-fossil-animation
          path: output/smithsonian-models/
          if-no-files-found: warn
          retention-days: 90
