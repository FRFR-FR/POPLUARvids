name: Render 15-minute video
on:
  workflow_dispatch:
  push:
    paths:
      - "render.py"\n      - "download_noaa.py"
      - "clip_manifest.csv"
      - ".github/workflows/render-video.yml"
      - "assets/clips/**"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate footage and render
        run: python render.py
      - name: Upload finished MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: animals-countdown-15min
          path: output/animals-countdown-15min.mp4
          if-no-files-found: error
          retention-days: 14
