name: Render 15-minute ocean-creatures video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate footage and render
        run: python render.py
      - name: Upload finished MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 7-most-dangerous-ocean-creatures-15min
          path: output/7-most-dangerous-ocean-creatures-15min.mp4
          if-no-files-found: error
          retention-days: 14
