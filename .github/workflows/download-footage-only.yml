name: Download footage only
on:
  push:
    paths:
      - ".github/workflows/download-footage-only.yml"
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download explicitly listed NOAA clips only
        run: python download_noaa.py
      - name: Upload downloaded source clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-noaa-footage
          path: assets/clips/*.mp4
          if-no-files-found: warn
          retention-days: 14
